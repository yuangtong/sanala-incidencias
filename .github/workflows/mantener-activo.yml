# Supabase (plan gratuito) pausa el proyecto tras 7 días sin actividad.
# Esta consulta diaria lo mantiene activo.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 13 * * *'   # todos los días, 8:17 a. m. hora de Lima
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar el listado público
        run: |
          curl -fsS "https://vnoipupfwvlxilpvbdrz.supabase.co/rest/v1/v_incidencias?select=numero&limit=1" \
            -H "apikey: sb_publishable_6_j6w-KILOiCyw2AYKXKdg_dNRmR_Uf"
